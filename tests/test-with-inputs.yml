name: Test dynamic uses with inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Invoke dynamic-uses passing YAML inputs to the action
        id: action
        uses: .
        with:
          uses: ./tests/fixtures/simple-output-action
          with: |
            greeting: hi
            name: tester

      - name: Assert outputs JSON is valid and contains expected values
        env:
          OUTPUTS: ${{ steps.action.outputs.outputs }}
        run: |
          echo "outputs: $OUTPUTS"
          if [ -z "$OUTPUTS" ]; then
            echo "FAIL: outputs is empty"
            exit 1
          fi
          # Validate it is valid JSON
          echo "$OUTPUTS" | python3 -c "import sys,json; json.load(sys.stdin)" 2>&1
          if [ $? -ne 0 ]; then
            echo "FAIL: outputs is not valid JSON"
            exit 1
          fi
          RESULT=$(echo "$OUTPUTS" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('result',''))")
          echo "result: $RESULT"
          if [ "$RESULT" != "hi-tester" ]; then
            echo "FAIL: expected result=hi-tester, got: $RESULT"
            exit 1
          fi
          echo "PASS: outputs is valid JSON with expected values: $OUTPUTS"
