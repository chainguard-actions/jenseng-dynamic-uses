name: Test dynamic uses outputs capture
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Dynamically call action that sets multiple outputs
        id: action
        uses: .
        with:
          uses: ./tests/fixtures/simple-action
          with: |
            greeting: hello
            name: world
            count: "42"

      - name: Assert outputs JSON contains all expected keys
        env:
          OUTPUTS: ${{ steps.action.outputs.outputs }}
        run: |
          echo "outputs: $OUTPUTS"
          if [ -z "$OUTPUTS" ]; then
            echo "FAIL: outputs is empty"
            exit 1
          fi

          FOO=$(echo "$OUTPUTS" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('foo',''))" 2>/dev/null || echo "")
          COUNT=$(echo "$OUTPUTS" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('count',''))" 2>/dev/null || echo "")

          echo "foo: $FOO"
          echo "count: $COUNT"

          if [ "$FOO" != "bar" ]; then
            echo "FAIL: expected foo=bar, got: $FOO"
            exit 1
          fi

          if [ "$COUNT" != "42" ]; then
            echo "FAIL: expected count=42, got: $COUNT"
            exit 1
          fi

          echo "PASS: all outputs captured correctly"
