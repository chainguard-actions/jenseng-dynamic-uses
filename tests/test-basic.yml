name: Test basic dynamic uses
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Invoke dynamic-uses with a local fixture action
        id: action
        uses: .
        with:
          uses: ./tests/fixtures/simple-output-action

      - name: Assert outputs JSON contains expected value
        env:
          OUTPUTS: ${{ steps.action.outputs.outputs }}
        run: |
          echo "outputs: $OUTPUTS"
          if [ -z "$OUTPUTS" ]; then
            echo "FAIL: outputs is empty"
            exit 1
          fi
          RESULT=$(echo "$OUTPUTS" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('result',''))" 2>/dev/null || echo "")
          echo "result: $RESULT"
          if [ "$RESULT" != "hello-world" ]; then
            echo "FAIL: expected result=hello-world, got: $RESULT"
            exit 1
          fi
          echo "PASS"
