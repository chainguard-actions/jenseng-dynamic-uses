name: Test dynamic uses outputs JSON structure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Invoke dynamic-uses and capture multiple outputs
        id: action
        uses: .
        with:
          uses: ./tests/fixtures/multi-output-action

      - name: Assert outputs JSON contains all expected keys and values
        env:
          OUTPUTS: ${{ steps.action.outputs.outputs }}
        run: |
          echo "outputs: $OUTPUTS"
          if [ -z "$OUTPUTS" ]; then
            echo "FAIL: outputs is empty"
            exit 1
          fi

          # Parse and check each output
          FOO=$(echo "$OUTPUTS" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('foo',''))")
          COUNT=$(echo "$OUTPUTS" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('count',''))")
          FLAG=$(echo "$OUTPUTS" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('flag',''))")

          echo "foo: $FOO"
          echo "count: $COUNT"
          echo "flag: $FLAG"

          FAIL=0
          if [ "$FOO" != "bar" ]; then
            echo "FAIL: expected foo=bar, got: $FOO"
            FAIL=1
          fi
          if [ "$COUNT" != "42" ]; then
            echo "FAIL: expected count=42, got: $COUNT"
            FAIL=1
          fi
          if [ "$FLAG" != "true" ]; then
            echo "FAIL: expected flag=true, got: $FLAG"
            FAIL=1
          fi

          if [ "$FAIL" = "1" ]; then
            exit 1
          fi
          echo "PASS: all outputs matched"
